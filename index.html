<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BeatStudio - Music Studio</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark studio-navbar px-4">

        <div class="container-fluid">

            <span class="navbar-brand fw-bold fs-4">
                🎵 Beat<span>Studio</span>
            </span><div>

                <button class="btn btn-outline-light">
                    New
                </button>

                <button class="btn btn-outline-light">
                    Save
                </button>

                <button class="btn btn-outline-light">
                    Load
                </button>

            </div>

        </div>

    </nav>
    <!-- CONTROL BAR -->

    <div class="control-bar">

        <div class="container-fluid">

            <div class="row align-items-center">

                <div class="col-md-6">

                    <button
                        class="btn control-btn me-2"
                        onclick="playMusic()"
                    >
                        ▶ Play
                    </button>
                    <button
                        class="btn control-btn me-2"
                        onclick="pauseMusic()"
                    >
                        ⏸ Pause
                    </button>

                    <button
                        class="btn control-btn me-2"
                        onclick="stopMusic()"
                    >
                        ⏹ Stop
                    </button>

                    <button
                        class="btn btn-outline-danger"
                        onclick="recordMusic()"
                    >
                        🔴 Record
                    </button>

                </div>
                <div class="col-md-6">

                    <div class="d-flex justify-content-md-end align-items-center gap-3">

                        <span>BPM</span>

                        <input
                            type="range"
                            min="60"
                            max="200"
                            value="120"
                            id="bpm"
                            oninput="changeBPM()"
                        ><strong id="bpmValue">
                            120
                        </strong>

                        <span>
                            4/4
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </div>
    <!-- MAIN -->

    <div class="container-fluid mt-4">

        <div class="row g-3">

            <!-- TRACKS -->

            <div class="col-lg-3">

                <div class="panel">

                    <h5 class="panel-title">
                        TRACKS
                    </h5>

                    <div class="track">

                        <div class="track-name">
                            🎤 Voice
                        </div>

                        <div class="track-controls">

                            <button class="small-btn">
                                M
                            </button>

                            <button class="small-btn">
                                S
                            </button>

                        </div>

                        <div class="volume">
                            <div class="volume-level"></div>
                        </div>

                    </div>
                    <div class="track">

                        <div class="track-name">
                            🎹 Piano
                        </div>

                        <div class="track-controls">

                            <button class="small-btn">
                                M
                            </button>

                            <button class="small-btn">
                                S
                            </button>

                        </div>
                        <div class="volume">
                            <div class="volume-level"></div>
                        </div>

                    </div>

                    <div class="track">

                        <div class="track-name">
                            🥁 Drums
                        </div>

                        <div class="track-controls">

                            <button class="small-btn">
                                M
                            </button>

                            <button class="small-btn">
                                S
                            </button>

                        </div>

                        <div class="volume">
                            <div class="volume-level"></div>
                        </div>

                    </div>
                    <div class="track">

                        <div class="track-name">
                            🎸 Guitar
                        </div>

                        <div class="track-controls">

                            <button class="small-btn">
                                M
                            </button>

                            <button class="small-btn">
                                S
                            </button>

                        </div>
                        <div class="volume">
                            <div class="volume-level"></div>
                        </div>

                    </div>

                    <div class="track">

                        <div class="track-name">
                            🎻 Strings
                        </div>

                        <div class="track-controls">

                            <button class="small-btn">
                                M
                            </button>

                            <button class="small-btn">
                                S
                            </button>

                        </div>

                        <div class="volume">
                            <div class="volume-level"></div>
                        </div>

                    </div>
                    <button class="btn btn-outline-light w-100 mt-3">
                        + Add Track
                    </button>

                </div>

            </div>

            <!-- TIMELINE -->

            <div class="col-lg-9">

                <div class="panel timeline-panel">

                    <div class="timeline-header">

                        <span>
                            Timeline
                        </span>

                        <span id="selectedInstrument">
                            Piano
                        </span>

                    </div>
                    <div class="timeline">

                        <div class="numbers">

                            <span>1</span>
                            <span>2</span>
                            <span>3</span>
                            <span>4</span>
                            <span>5</span>
                            <span>6</span>
                            <span>7</span>
                            <span>8</span>

                        </div>
                        <div class="timeline-track">

                            <div class="music-block block-one">
                                C
                            </div>

                            <div class="music-block block-two">
                                E
                            </div>

                            <div class="music-block block-three">
                                G
                            </div>

                            <div class="music-block block-four">
                                C
                            </div>

                        </div>
                        <div class="timeline-track">

                            <div class="music-block guitar-block">
                                Guitar
                            </div>

                        </div>

                        <div class="timeline-track">

                            <div class="music-block drum-block">
                                Beat
                            </div>

                            <div class="music-block drum-block second">
                                Beat
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>
        <!-- MUSIC STAFF -->

        <div class="row mt-3">

            <div class="col-12">

                <div class="panel">

                    <h5 class="panel-title">
                        🎼 MUSIC STAFF
                    </h5>

                    <div class="staff">

                        <div class="clef">
                            𝄞
                        </div>
                        <div class="staff-lines">

                            <div></div>
                            <div></div>
                            <div></div>
                            <div></div>
                            <div></div>

                            <div class="note note-1">
                                ●
                            </div>

                            <div class="note note-2">
                                ●
                            </div>

                            <div class="note note-3">
                                ●
                            </div>

                            <div class="note note-4">
                                ●
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>
        <!-- INSTRUMENTS -->

        <div class="row mt-3">

            <div class="col-12">

                <div class="panel">

                    <h5 class="panel-title">
                        🎛️ INSTRUMENTS
                    </h5>

                    <div class="d-flex flex-wrap gap-2">

                        <button
                            class="btn instrument-btn selected"
                            onclick="selectInstrument('Piano', this)"
                        >
                            Piano
                        </button>
                        <button
                            class="btn instrument-btn"
                            onclick="selectInstrument('Drums', this)"
                        >
                            Drums
                        </button>

                        <button
                            class="btn instrument-btn"
                            onclick="selectInstrument('Guitar', this)"
                        >
                            Guitar
                        </button>

                        <button
                            class="btn instrument-btn"
                            onclick="selectInstrument('Bass', this)"
                        >
                            Bass
                        </button>
                        <button
                            class="btn instrument-btn"
                            onclick="selectInstrument('Strings', this)"
                        >
                            Strings
                        </button>

                        <button
                            class="btn instrument-btn"
                            onclick="selectInstrument('Synth', this)"
                        >
                            Synth
                        </button>

                        <button
                            class="btn instrument-btn"
                            onclick="selectInstrument('Flute', this)"
                        >
                            Flute
                        </button>
                        <button
                            class="btn instrument-btn"
                            onclick="selectInstrument('Organ', this)"
                        >
                            Organ
                        </button>
                    </div>

                </div>

            </div>

        </div>
        <!-- PIANO -->

        <div class="row mt-3 mb-5">

            <div class="col-12">

                <div class="panel">

                    <h5 class="panel-title">
                        🎹 PIANO
                    </h5>

                    <div class="piano">

                        <button
                            class="key"
                            onclick="playNote('C4')"
                        >
                            C4
                        </button>
                        <button
                            class="key"
                            onclick="playNote('D4')"
                        >
                            D4
                        </button>

                        <button
                            class="key"
                            onclick="playNote('E4')"
                        >
                            E4
                        </button>

                        <button
                            class="key"
                            onclick="playNote('F4')"
                        >
                            F4
                        </button>
                        <button
                            class="key"
                            onclick="playNote('G4')"
                        >
                            G4
                        </button>

                        <button
                            class="key"
                            onclick="playNote('A4')"
                        >
                            A4
                        </button>
                        <button
                            class="key"
                            onclick="playNote('B4')"
                        >
                            B4
                        </button>

                        <button
                            class="key"
                            onclick="playNote('C5')"
                        >
                            C5
                        </button>
                        </div>

                </div>

            </div>

        </div>

    </div>

    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
